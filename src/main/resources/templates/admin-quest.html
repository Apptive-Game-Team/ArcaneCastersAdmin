<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>Admin - Quest Management</title>
</head>

<body>

<div layout:fragment="content">
    <div class="container">
        <h1>Quest Management</h1>
        <form class="form-inline mt-3 mb-3" method="get" action="/admin/quest">
            <label class="mr-2" for="db-select">View DB</label>
            <select id="db-select" name="db" class="form-control mr-2" onchange="this.form.submit()">
                <option value="primary" th:selected="${selectedDb == 'primary'}">Prod</option>
                <option value="secondary" th:selected="${selectedDb == 'secondary'}" th:disabled="${!secondaryDatabaseEnabled}">Dev</option>
            </select>
            <button type="button" id="sync-quest-to-secondary" class="btn btn-outline-secondary mr-2" th:disabled="${!secondaryDatabaseEnabled}">Prod -> Dev</button>
            <button type="button" id="sync-quest-to-primary" class="btn btn-outline-secondary" th:disabled="${!secondaryDatabaseEnabled}">Dev -> Prod</button>
        </form>
        <div class="card mt-4">
            <div class="card-header">
                <h2>Quests</h2>
            </div>
            <div class="card-body">
                <button type="button" class="btn btn-primary mb-3" data-toggle="modal" data-target="#createQuestModal">
                    Create Quest
                </button>
                <div class="form-group mt-3">
                    <label for="quest-search">Search</label>
                    <input type="text" class="form-control" id="quest-search" placeholder="Search by id, condition, or reward">
                </div>

                <table class="table table-striped mt-3">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Condition Type</th>
                        <th>Condition Target ID</th>
                        <th>Require Value</th>
                        <th>Rewards</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody id="quest-table-body">
                    <tr th:each="quest : ${quests}">
                        <td th:text="${quest.id}"></td>
                        <td th:text="${quest.conditionType}"></td>
                        <td th:text="${quest.conditionTargetId}"></td>
                        <td th:text="${quest.requireValue}"></td>
                        <td>
                            <ul class="list-unstyled mb-0">
                                <li th:each="reward : ${quest.rewards}">
                                    <small th:text="${reward.rewardType + (reward.targetId != null ? ' #' + reward.targetId : '') + ' x' + reward.amount}"></small>
                                </li>
                            </ul>
                        </td>
                        <td>
                            <button type="button" class="btn btn-sm btn-info edit-quest-btn" 
                                    th:data-quest-id="${quest.id}"
                                    th:data-condition-type="${quest.conditionType}"
                                    th:data-condition-target-id="${quest.conditionTargetId}"
                                    th:data-require-value="${quest.requireValue}"
                                    th:data-rewards="${#strings.arrayJoin(quest.rewards.![rewardType + '|' + (targetId != null ? targetId : '') + '|' + amount], ',')}"
                                    data-toggle="modal"
                                    data-target="#editQuestModal">
                                Edit
                            </button>
                            <button type="button" class="btn btn-sm btn-danger delete-quest-btn" 
                                    th:data-quest-id="${quest.id}">
                                Delete
                            </button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <datalist id="conditionTypeOptions">
        <option value="STAGE_CLEAR"></option>
        <option value="TOTAL_WIN"></option>
    </datalist>
    <datalist id="rewardTypeOptions">
        <option value="MAGIC"></option>
        <option value="DECORATION"></option>
    </datalist>

    <!-- Create Quest Modal -->
    <div class="modal fade" id="createQuestModal" tabindex="-1" aria-labelledby="createQuestModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="createQuestModalLabel">Create Quest</h5>
                    <button type="button" class="btn-close" data-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="createQuestForm">
                        <div class="mb-3">
                            <label for="createConditionType" class="form-label">Condition Type</label>
                            <input type="text" class="form-control" id="createConditionType" name="conditionType" list="conditionTypeOptions" maxlength="63" required>
                        </div>
                        <div class="mb-3">
                            <label for="createConditionTargetId" class="form-label">Condition Target ID (optional)</label>
                            <input type="number" class="form-control" id="createConditionTargetId" name="conditionTargetId">
                        </div>
                        <div class="mb-3">
                            <label for="createRequireValue" class="form-label">Require Value</label>
                            <input type="number" class="form-control" id="createRequireValue" name="requireValue" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Rewards</label>
                            <div id="createRewardsList"></div>
                            <button type="button" class="btn btn-sm btn-secondary mt-2" onclick="addReward('create')">Add Reward</button>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="submitCreateQuest()">Create Quest</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Quest Modal -->
    <div class="modal fade" id="editQuestModal" tabindex="-1" aria-labelledby="editQuestModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editQuestModalLabel">Edit Quest</h5>
                    <button type="button" class="btn-close" data-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="editQuestForm">
                        <input type="hidden" id="editQuestId" name="questId">
                        <div class="mb-3">
                            <label for="editConditionType" class="form-label">Condition Type</label>
                            <input type="text" class="form-control" id="editConditionType" name="conditionType" list="conditionTypeOptions" maxlength="63" required>
                        </div>
                        <div class="mb-3">
                            <label for="editConditionTargetId" class="form-label">Condition Target ID (optional)</label>
                            <input type="number" class="form-control" id="editConditionTargetId" name="conditionTargetId">
                        </div>
                        <div class="mb-3">
                            <label for="editRequireValue" class="form-label">Require Value</label>
                            <input type="number" class="form-control" id="editRequireValue" name="requireValue" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Rewards</label>
                            <div id="editRewardsList"></div>
                            <button type="button" class="btn btn-sm btn-secondary mt-2" onclick="addReward('edit')">Add Reward</button>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="submitEditQuest()">Update Quest</button>
                </div>
            </div>
        </div>
    </div>

<script th:inline="javascript">
        const selectedDb = /*[[${selectedDb}]]*/ 'primary';

        function withDb(url) {
            return `${url}${url.includes('?') ? '&' : '?'}db=${selectedDb}`;
        }

        async function postSync(url) {
            try {
                const response = await fetch(url, { method: 'POST' });
                const message = await response.text();
                alert(message || (response.ok ? 'Sync completed.' : 'Sync failed.'));
                if (response.ok) {
                    window.location.reload();
                }
            } catch (error) {
                alert(`Sync failed: ${error.message}`);
            }
        }

        function addReward(mode, reward) {
            const container = document.getElementById(mode + 'RewardsList');
            const rewardDiv = document.createElement('div');
            rewardDiv.className = 'input-group mb-2';
            rewardDiv.innerHTML = `
                <input type="text" class="form-control reward-type" list="rewardTypeOptions" placeholder="Type" maxlength="63">
                <input type="number" class="form-control reward-target" placeholder="Target ID (optional)">
                <input type="number" class="form-control reward-amount" placeholder="Amount" min="1">
                <button type="button" class="btn btn-danger" onclick="this.parentElement.remove()">Remove</button>
            `;
            if (reward) {
                rewardDiv.querySelector('.reward-type').value = reward.rewardType;
                rewardDiv.querySelector('.reward-target').value = reward.targetId ?? '';
                rewardDiv.querySelector('.reward-amount').value = reward.amount;
            }
            container.appendChild(rewardDiv);
        }

        function collectRewards(mode) {
            const rewards = [];
            document.querySelectorAll('#' + mode + 'RewardsList .input-group').forEach(group => {
                const rewardType = group.querySelector('.reward-type').value.trim();
                const targetText = group.querySelector('.reward-target').value;
                const amount = parseInt(group.querySelector('.reward-amount').value);
                if (rewardType && !isNaN(amount)) {
                    rewards.push({
                        id: null,
                        rewardType: rewardType,
                        targetId: targetText === '' ? null : parseInt(targetText),
                        amount: amount
                    });
                }
            });
            return rewards;
        }

        function collectQuest(mode) {
            const targetText = document.getElementById(mode + 'ConditionTargetId').value;
            return {
                conditionType: document.getElementById(mode + 'ConditionType').value.trim(),
                conditionTargetId: targetText === '' ? null : parseInt(targetText),
                requireValue: parseInt(document.getElementById(mode + 'RequireValue').value),
                rewards: collectRewards(mode)
            };
        }

        function submitCreateQuest() {
            const data = collectQuest('create');

            fetch(withDb('/api/admin/quests'), {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            }).then(response => {
                if (response.ok) {
                    window.location.reload();
                } else {
                    alert('Failed to create quest');
                }
            });
        }

        function submitEditQuest() {
            const questId = document.getElementById('editQuestId').value;
            const data = collectQuest('edit');

            fetch(withDb(`/api/admin/quests/${questId}`), {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            }).then(response => {
                if (response.ok) {
                    window.location.reload();
                } else {
                    alert('Failed to update quest');
                }
            });
        }

        // Edit button handler
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('quest-search').addEventListener('input', function(event) {
                const query = event.target.value.trim().toLowerCase();
                document.querySelectorAll('#quest-table-body tr').forEach(row => {
                    row.style.display = row.innerText.toLowerCase().includes(query) ? '' : 'none';
                });
            });

            document.getElementById('sync-quest-to-secondary').addEventListener('click', function() {
                if (confirm('Sync prod quests to dev DB?')) {
                    postSync('/api/admin/quests/sync-to-secondary');
                }
            });

            document.getElementById('sync-quest-to-primary').addEventListener('click', function() {
                if (confirm('Sync dev quests to prod DB?')) {
                    postSync('/api/admin/quests/sync-to-primary');
                }
            });

            document.querySelectorAll('.edit-quest-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const questId = this.getAttribute('data-quest-id');
                    const conditionType = this.getAttribute('data-condition-type');
                    const conditionTargetId = this.getAttribute('data-condition-target-id');
                    const requireValue = this.getAttribute('data-require-value');
                    const rewardsStr = this.getAttribute('data-rewards');

                    document.getElementById('editQuestId').value = questId;
                    document.getElementById('editConditionType').value = conditionType || '';
                    document.getElementById('editConditionTargetId').value = conditionTargetId || '';
                    document.getElementById('editRequireValue').value = requireValue;

                    document.getElementById('editRewardsList').innerHTML = '';
                    if (rewardsStr) {
                        rewardsStr.split(',').forEach(entry => {
                            if (entry) {
                                const [rewardType, targetId, amount] = entry.split('|');
                                addReward('edit', {
                                    rewardType: rewardType,
                                    targetId: targetId === '' ? null : targetId,
                                    amount: amount
                                });
                            }
                        });
                    }
                });
            });

            // Delete button handler
            document.querySelectorAll('.delete-quest-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const questId = this.getAttribute('data-quest-id');
                    
                    if (confirm('Are you sure you want to delete this quest?')) {
                        fetch(withDb(`/api/admin/quests/${questId}`), {
                            method: 'DELETE'
                        }).then(response => {
                            if (response.ok) {
                                window.location.reload();
                            } else {
                                alert('Failed to delete quest');
                            }
                        });
                    }
                });
            });
        });
    </script>

</body>
</html>
