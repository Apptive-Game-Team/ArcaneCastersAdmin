<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>밸런스 스프레드시트</title>
    <link rel="stylesheet" th:href="@{/css/balance-sheet.css}">
</head>
<body>
<div layout:fragment="content">
    <h1>밸런스 스프레드시트</h1>
    <p>총 DPS와 총 HP는 소환 수를 반영합니다. DPS는 모든 개체가 동시에 단일 대상을 공격하는 기본 공격 기준이며, 광역·연쇄·지속 피해는 별도로 확인하세요.</p>
    <div id="balance-toolbar" class="balance-toolbar">
        <label>검색 <input id="sheet-search" type="search" placeholder="객체 이름 또는 parameter"></label>
        <label>종류 <select id="sheet-kind"><option value="">전체</option><option value="unit">유닛</option><option value="building">건물</option><option value="projectile">투사체</option><option value="effect">효과</option><option value="other">기타</option></select></label>
        <label>태그 (모두 일치) <input id="sheet-tags" placeholder="쉼표로 구분" list="sheet-tag-list"><datalist id="sheet-tag-list"></datalist></label>
        <label>필터 기준 <select id="sheet-basis"><option value="either">Deploy 또는 Dev</option><option value="primary">Deploy</option><option value="secondary">Dev</option></select></label>
        <label>표시 <select id="sheet-view"><option value="both">Deploy / Dev</option><option value="secondary">Dev</option><option value="primary">Deploy</option></select></label>
        <label>정렬 기준 DB <select id="sheet-sort-db"><option value="secondary">Dev</option><option value="primary">Deploy</option></select></label>
        <label>정렬 <select id="sheet-sort"></select></label>
        <label><input id="sheet-desc" type="checkbox" checked> 내림차순</label>
        <label><input id="sheet-empty" type="checkbox" checked> 모두 N/A인 열 숨김</label>
        <label><input id="sheet-diff-rows" type="checkbox"> 차이 있는 행만</label>
        <label><input id="sheet-diff-cols" type="checkbox"> 차이 있는 열만</label>
        <label><input id="sheet-selected" type="checkbox"> 선택한 객체만</label>
        <button type="button" id="sheet-reset">보기 초기화</button>
    </div>
    <details><summary>열 그룹과 순서</summary><div id="sheet-columns" class="balance-toolbar"></div></details>
    <p id="sheet-status" role="status" aria-live="polite"></p>
    <div class="balance-scroll"><table id="balance-table" class="table table-bordered"><thead></thead><tbody></tbody></table></div>
    <details id="sheet-change-panel"><summary id="sheet-change-count">변경 0개</summary><ul id="sheet-changes"></ul></details>
    <div class="balance-toolbar">
        <button type="button" id="sheet-save" class="btn btn-success">변경 저장</button>
        <button type="button" id="sheet-undo">전체 되돌리기</button>
        <button type="button" id="sheet-to-dev" th:disabled="${!secondaryDatabaseEnabled}">Deploy → Dev 전체 복사</button>
        <button type="button" id="sheet-to-deploy" th:disabled="${!secondaryDatabaseEnabled}">Dev → Deploy 전체 복사</button>
    </div>
    <script th:inline="javascript">window.balanceSheetData = /*[[${balanceSheet}]]*/ null;</script>
    <script th:src="@{/js/balance-model.js}"></script>
    <script th:src="@{/js/balance-sheet.js}"></script>
</div>
</body>
</html>
