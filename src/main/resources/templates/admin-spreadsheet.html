<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>Admin - Game Object Comparison</title>
    <style>
        .table-responsive {
            overflow-x: auto;
        }

        .comparison-table th,
        .comparison-table td {
            min-width: 110px;
            white-space: nowrap;
        }

        .comparison-table .name-column {
            background: #151210;
            left: 0;
            min-width: 220px;
            position: sticky;
            z-index: 2;
        }

        .comparison-table thead .name-column {
            background: #0a0908;
            z-index: 3;
        }

        .missing-db {
            color: #736861;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
<div layout:fragment="content">
    <div class="container-fluid">
        <h1>Game Object Deploy / Dev Comparison</h1>

        <div class="mb-3">
            <button type="button" id="sync-spreadsheet-to-secondary"
                    class="btn btn-outline-secondary"
                    th:disabled="${!secondaryDatabaseEnabled}">Deploy -> Dev</button>
            <button type="button" id="sync-spreadsheet-to-primary"
                    class="btn btn-outline-secondary ml-2"
                    th:disabled="${!secondaryDatabaseEnabled}">Dev -> Deploy</button>
        </div>

        <form class="form mb-3">
            <div class="form-group">
                <label for="tags-input">Filter by Deploy Tags:</label>
                <input type="text" class="form-control" id="tags-input" name="tags"
                       th:value="${param.tags}" placeholder="e.g., tag1,tag2">
            </div>
            <div class="form-group">
                <label for="spreadsheet-search">Search:</label>
                <input type="text" class="form-control" id="spreadsheet-search"
                       placeholder="Search by game object, parameter, or value">
            </div>
            <div class="form-group mt-2">
                <div class="form-check form-check-inline" th:each="tag : ${allTags}">
                    <input class="form-check-input tag-checkbox" type="checkbox"
                           th:value="${tag.name}" th:id="|tag_${tag.id}|"
                           th:checked="${param.tags != null && #strings.contains(param.tags, tag.name)}">
                    <label class="form-check-label" th:for="|tag_${tag.id}|"
                           th:text="${tag.name}"></label>
                </div>
            </div>
            <button type="submit" class="btn btn-primary mt-2">Filter</button>
        </form>

        <div class="table-responsive">
            <table class="table table-striped table-bordered comparison-table">
                <thead class="thead-dark">
                <tr>
                    <th class="name-column" rowspan="2">Game Object</th>
                    <th:block th:each="parameterName : ${parameterNames}">
                        <th colspan="2" th:text="${parameterName}"></th>
                    </th:block>
                </tr>
                <tr>
                    <th:block th:each="parameterName : ${parameterNames}">
                        <th>Deploy</th>
                        <th>Dev</th>
                    </th:block>
                </tr>
                </thead>
                <tbody id="spreadsheet-table-body">
                <tr th:each="gameObject : ${gameObjects}">
                    <td class="name-column">
                        <strong th:text="${gameObject.name}"></strong>
                        <div class="missing-db" th:if="${!gameObject.primaryPresent}">Deploy: N/A</div>
                        <div class="missing-db" th:if="${!gameObject.secondaryPresent}">Dev: N/A</div>
                    </td>
                    <th:block th:each="parameter : ${gameObject.parameters}">
                        <td>
                            <input type="number" step="any"
                                   class="form-control editable-param"
                                   data-db="primary"
                                   th:attr="data-game-object-name=${gameObject.name},
                                            data-param-name=${parameter.name},
                                            data-initial-value=${parameter.primaryValue}"
                                   th:value="${parameter.primaryValue}"
                                   placeholder="N/A">
                        </td>
                        <td>
                            <input type="number" step="any"
                                   class="form-control editable-param"
                                   data-db="secondary"
                                   th:disabled="${!secondaryDatabaseEnabled}"
                                   th:attr="data-game-object-name=${gameObject.name},
                                            data-param-name=${parameter.name},
                                            data-initial-value=${parameter.secondaryValue}"
                                   th:value="${parameter.secondaryValue}"
                                   placeholder="N/A">
                        </td>
                    </th:block>
                </tr>
                </tbody>
            </table>
        </div>
        <button id="save-changes" class="btn btn-success">Save Changes</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const tagsInput = document.getElementById('tags-input');
            const checkboxes = document.querySelectorAll('.tag-checkbox');
            const spreadsheetSearch = document.getElementById('spreadsheet-search');

            function normalizedValue(input) {
                return input.value.trim();
            }

            function getRowSearchText(row) {
                const inputText = Array.from(row.querySelectorAll('input'))
                    .map(input => input.value || '')
                    .join(' ');
                const parameterNames = Array.from(row.querySelectorAll('.editable-param'))
                    .map(input => input.dataset.paramName)
                    .join(' ');
                return `${row.innerText} ${inputText} ${parameterNames}`.toLowerCase();
            }

            spreadsheetSearch.addEventListener('input', function(event) {
                const query = event.target.value.trim().toLowerCase();
                document.querySelectorAll('#spreadsheet-table-body tr').forEach(row => {
                    row.style.display = getRowSearchText(row).includes(query) ? '' : 'none';
                });
            });

            checkboxes.forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    tagsInput.value = Array.from(checkboxes)
                        .filter(item => item.checked)
                        .map(item => item.value)
                        .join(',');
                });
            });

            document.getElementById('save-changes').addEventListener('click', async function() {
                const updates = Array.from(document.querySelectorAll('.editable-param'))
                    .filter(input => normalizedValue(input) !== (input.dataset.initialValue || ''))
                    .map(input => ({
                        gameObjectName: input.dataset.gameObjectName,
                        parameterName: input.dataset.paramName,
                        value: normalizedValue(input) === '' ? null : Number(input.value),
                        db: input.dataset.db
                    }));

                if (updates.length === 0) {
                    alert('No changes to save.');
                    return;
                }

                const response = await fetch('/api/admin/spread-sheets/game-objects/by-name', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(updates)
                });
                const message = await response.text();
                alert(message || (response.ok ? 'Changes saved.' : 'Save failed.'));
                if (response.ok) {
                    window.location.reload();
                }
            });

            async function postSync(url, message) {
                if (!confirm(message)) {
                    return;
                }
                const response = await fetch(url, {method: 'POST'});
                alert(await response.text());
                if (response.ok) {
                    window.location.reload();
                }
            }

            document.getElementById('sync-spreadsheet-to-secondary').addEventListener('click', function() {
                postSync('/api/admin/spread-sheets/sync-to-secondary', 'Sync Deploy values to Dev?');
            });
            document.getElementById('sync-spreadsheet-to-primary').addEventListener('click', function() {
                postSync('/api/admin/spread-sheets/sync-to-primary', 'Sync Dev values to Deploy?');
            });
        });
    </script>
</div>
</body>
</html>
