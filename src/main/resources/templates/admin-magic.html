<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>Admin - Magic Comparison</title>
</head>

<body>
<div layout:fragment="content">
    <div class="container py-4">
        <h1>Magic Deploy / Dev Comparison</h1>
        <p class="text-muted">
            Mana cost and range are edited on the parameter screen at
            <code>/admin/game-object/by-name/{name}</code>. The magic name equals the
            game object name.
        </p>

        <div class="mb-3">
            <button type="button" id="sync-magic-to-secondary" class="btn btn-outline-secondary"
                    th:disabled="${!secondaryDatabaseEnabled}">Deploy -> Dev</button>
            <button type="button" id="sync-magic-to-primary" class="btn btn-outline-secondary ml-2"
                    th:disabled="${!secondaryDatabaseEnabled}">Dev -> Deploy</button>
        </div>

        <div class="card mb-4">
            <div class="card-header"><h4>Create Magic Card</h4></div>
            <div class="card-body">
                <form th:action="@{/admin/magic/by-name/create}" method="post" class="form-inline">
                    <input type="text" class="form-control" name="name" placeholder="Magic name" required>
                    <select class="form-control ml-2" name="element">
                        <option value="Fire">Fire</option>
                        <option value="Water">Water</option>
                        <option value="Lightning">Lightning</option>
                        <option value="Rock">Rock</option>
                        <option value="Nature">Nature</option>
                        <option value="Wind">Wind</option>
                        <option value="None" selected>None</option>
                    </select>
                    <input type="text" class="form-control ml-2" name="accessType" value="DEFAULT"
                           placeholder="Access type" required>
                    <select class="form-control ml-2" name="db">
                        <option value="primary">Deploy</option>
                        <option value="secondary" th:disabled="${!secondaryDatabaseEnabled}">Dev</option>
                    </select>
                    <button type="submit" class="btn btn-primary ml-2">Create</button>
                </form>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header"><h4>Bulk Actions</h4></div>
            <div class="card-body">
                <div class="form-inline">
                    <select id="bulk-db" class="form-control">
                        <option value="primary">Deploy</option>
                        <option value="secondary" th:disabled="${!secondaryDatabaseEnabled}">Dev</option>
                    </select>
                    <button type="button" id="bulk-delete" class="btn btn-danger ml-2">Delete</button>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="magic-search">Search</label>
            <input type="text" class="form-control" id="magic-search"
                   placeholder="Search magic card">
        </div>

        <div th:each="magic : ${magics}" class="card mb-4 magic-search-item">
            <div class="card-header">
                <label class="mb-0">
                    <input type="checkbox" class="magic-checkbox" th:value="${magic.name}">
                    <strong th:text="${magic.name}"></strong>
                </label>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <h4>Deploy</h4>
                        <div th:if="${!magic.primaryPresent}" class="text-muted">N/A</div>
                        <form th:if="${magic.primaryPresent}"
                              th:action="@{/admin/magic/by-name/update}" method="post"
                              class="form-inline mb-3">
                            <input type="hidden" name="db" value="primary">
                            <input type="hidden" name="currentName" th:value="${magic.name}">
                            <input type="text" class="form-control" name="name" th:value="${magic.name}">
                            <select class="form-control ml-2" name="element">
                                <option value="Fire" th:selected="${magic.primaryElement == 'Fire'}">Fire</option>
                                <option value="Water" th:selected="${magic.primaryElement == 'Water'}">Water</option>
                                <option value="Lightning" th:selected="${magic.primaryElement == 'Lightning'}">Lightning</option>
                                <option value="Rock" th:selected="${magic.primaryElement == 'Rock'}">Rock</option>
                                <option value="Nature" th:selected="${magic.primaryElement == 'Nature'}">Nature</option>
                                <option value="Wind" th:selected="${magic.primaryElement == 'Wind'}">Wind</option>
                                <option value="None" th:selected="${magic.primaryElement == 'None'}">None</option>
                            </select>
                            <input type="text" class="form-control ml-2" name="accessType"
                                   th:value="${magic.primaryAccessType}">
                            <button class="btn btn-info ml-2" type="submit">Update</button>
                        </form>
                        <form th:if="${magic.primaryPresent}"
                              th:action="@{/admin/magic/by-name/delete}" method="post" class="mb-3">
                            <input type="hidden" name="db" value="primary">
                            <input type="hidden" name="name" th:value="${magic.name}">
                            <button class="btn btn-danger" type="submit">Delete</button>
                        </form>
                    </div>
                    <div class="col-md-6">
                        <h4>Dev</h4>
                        <div th:if="${!magic.secondaryPresent}" class="text-muted">N/A</div>
                        <form th:if="${magic.secondaryPresent}"
                              th:action="@{/admin/magic/by-name/update}" method="post"
                              class="form-inline mb-3">
                            <input type="hidden" name="db" value="secondary">
                            <input type="hidden" name="currentName" th:value="${magic.name}">
                            <input type="text" class="form-control" name="name" th:value="${magic.name}">
                            <select class="form-control ml-2" name="element">
                                <option value="Fire" th:selected="${magic.secondaryElement == 'Fire'}">Fire</option>
                                <option value="Water" th:selected="${magic.secondaryElement == 'Water'}">Water</option>
                                <option value="Lightning" th:selected="${magic.secondaryElement == 'Lightning'}">Lightning</option>
                                <option value="Rock" th:selected="${magic.secondaryElement == 'Rock'}">Rock</option>
                                <option value="Nature" th:selected="${magic.secondaryElement == 'Nature'}">Nature</option>
                                <option value="Wind" th:selected="${magic.secondaryElement == 'Wind'}">Wind</option>
                                <option value="None" th:selected="${magic.secondaryElement == 'None'}">None</option>
                            </select>
                            <input type="text" class="form-control ml-2" name="accessType"
                                   th:value="${magic.secondaryAccessType}">
                            <button class="btn btn-info ml-2" type="submit">Update</button>
                        </form>
                        <form th:if="${magic.secondaryPresent}"
                              th:action="@{/admin/magic/by-name/delete}" method="post" class="mb-3">
                            <input type="hidden" name="db" value="secondary">
                            <input type="hidden" name="name" th:value="${magic.name}">
                            <button class="btn btn-danger" type="submit">Delete</button>
                        </form>
                    </div>
                </div>

                <table class="table table-sm table-striped mt-3">
                    <thead>
                    <tr>
                        <th></th>
                        <th>Element</th>
                        <th>Access Type</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr>
                        <td>Deploy</td>
                        <td th:text="${magic.primaryPresent} ? ${magic.primaryElement} : 'N/A'"></td>
                        <td th:text="${magic.primaryPresent} ? ${magic.primaryAccessType} : 'N/A'"></td>
                    </tr>
                    <tr>
                        <td>Dev</td>
                        <td th:text="${magic.secondaryPresent} ? ${magic.secondaryElement} : 'N/A'"></td>
                        <td th:text="${magic.secondaryPresent} ? ${magic.secondaryAccessType} : 'N/A'"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        document.getElementById('magic-search').addEventListener('input', function(event) {
            const query = event.target.value.trim().toLowerCase();
            document.querySelectorAll('.magic-search-item').forEach(item => {
                item.style.display = item.innerText.toLowerCase().includes(query) ? '' : 'none';
            });
        });

        function selectedMagicNames() {
            return Array.from(document.querySelectorAll('.magic-checkbox:checked'))
                .map(checkbox => checkbox.value);
        }

        function submitBulk(action, extra) {
            const names = selectedMagicNames();
            if (names.length === 0) {
                alert('Select at least one magic.');
                return;
            }
            const form = document.createElement('form');
            form.method = 'post';
            form.action = action;
            const values = {
                magicNames: names,
                db: document.getElementById('bulk-db').value,
                ...extra
            };
            Object.entries(values).forEach(([name, value]) => {
                (Array.isArray(value) ? value : [value]).forEach(item => {
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = name;
                    input.value = item;
                    form.appendChild(input);
                });
            });
            document.body.appendChild(form);
            form.submit();
        }

        document.getElementById('bulk-delete').addEventListener('click', function() {
            submitBulk('/admin/magic/by-name/bulk-delete', {});
        });

        async function sync(url, message) {
            if (!confirm(message)) {
                return;
            }
            const response = await fetch(url, {method: 'POST'});
            alert(await response.text());
            if (response.ok) {
                window.location.reload();
            }
        }
        document.getElementById('sync-magic-to-secondary').addEventListener('click', function() {
            sync('/admin/magic/sync-to-secondary', 'Sync Deploy magic to Dev?');
        });
        document.getElementById('sync-magic-to-primary').addEventListener('click', function() {
            sync('/admin/magic/sync-to-primary', 'Sync Dev magic to Deploy?');
        });
    </script>
</div>
</body>
</html>
