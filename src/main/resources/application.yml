server:
  port: ${PORT:8080}

# Metrics run on their own port so the public app port never serves /actuator.
# Health and Prometheus endpoints allow unauthenticated scrapes.
# MANAGEMENT_PORT must stay reachable only from the Prometheus host.
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

word-online:
  jwt:
    path: ${JWT_FILE_PATH}
  secondary-datasource:
    url: ${DEV_DATABASE_URL:}
    username: ${DEV_DATABASE_USER:}
    password: ${DEV_DATABASE_PW:}

spring:
  application:
    name: word-online-admin
  config:
    import: optional:file:.env[.properties]
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PW}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: true
        format_sql: true

logging:
  level:
    root: INFO
    com.wordonline.admin: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.transaction: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
